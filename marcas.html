<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movia — marcas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; }
        body { min-height:100vh; background: radial-gradient(circle at top left, rgba(253,224,232,0.9), transparent 32%), radial-gradient(circle at bottom right, rgba(255,247,235,0.95), transparent 28%), linear-gradient(180deg,#fff9f6 0%, #fffaf5 52%, #fffefc 100%); }
        .shadow-soft { box-shadow: 0 20px 50px rgba(15,23,42,0.08); }
        .glass-panel { background: rgba(255,255,255,0.88); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="lowercase text-slate-950 antialiased">
    <div class="relative mx-auto min-h-screen max-w-[1560px] px-6 py-8">
        <aside class="hidden lg:flex lg:fixed lg:top-8 lg:bottom-8 lg:left-8 lg:w-[320px] flex-col rounded-[2.5rem] bg-white p-8 shadow-soft">
            <div class="flex flex-col gap-8">
                <div>
                    <span class="inline-flex rounded-full bg-[#fde8ef] px-3 py-1 text-[0.82rem] font-semibold tracking-[0.24em] text-[#d6336c]">movia</span>
                    <h1 class="mt-6 text-3xl font-extrabold tracking-tight text-slate-950">gestão de frota</h1>
                    <p class="mt-3 max-w-[220px] text-sm leading-6 text-slate-500">painel de marcas — suave e direto.</p>
                </div>

                <nav class="space-y-3">
                    <a href="marcas.html" class="flex items-center justify-between rounded-[1.5rem] bg-[#fff1f7] px-5 py-4 text-sm font-semibold text-[#c92c6d] shadow-soft">
                        <span>marcas</span>
                        <span class="text-[#c92c6d]">•</span>
                    </a>
                    <a href="modelos.html" class="flex items-center justify-between rounded-[1.5rem] bg-slate-50 px-5 py-4 text-sm font-semibold text-slate-800 transition hover:bg-slate-100">
                        <span>modelos</span>
                        <span class="text-slate-400">→</span>
                    </a>
                    <a href="veiculos.html" class="flex items-center justify-between rounded-[1.5rem] bg-slate-50 px-5 py-4 text-sm font-semibold text-slate-800 transition hover:bg-slate-100">
                        <span>veículos</span>
                        <span class="text-slate-400">→</span>
                    </a>
                </nav>
            </div>

            <div class="mt-auto rounded-[2rem] bg-slate-50 p-5 text-sm text-slate-500 shadow-sm">
                feito com carinho por mim mesma: <span class="font-semibold text-slate-700">@paolasoaresmachado</span> :)
            </div>
        </aside>

        <main class="lg:ml-[360px]">
            <div class="flex flex-col gap-8">
                <section class="rounded-[2.5rem] bg-white p-8 shadow-soft glass-panel">
                    <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
                        <div class="max-w-2xl">
                            <p class="text-sm font-semibold tracking-[0.24em] text-pink-600">movia</p>
                            <h2 class="mt-4 text-4xl font-extrabold tracking-tight text-slate-950">marcas</h2>
                            <p class="mt-3 max-w-xl text-base leading-7 text-slate-500">gerencie as marcas com um toque leve — sem distrações.</p>
                        </div>

                        <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
                            <label class="relative block w-full max-w-[360px]">
                                <span class="sr-only">buscar marca</span>
                                <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-slate-400">🔎</span>
                                <input type="search" placeholder="buscar marca" class="w-full rounded-full border border-slate-200 bg-slate-100/90 py-4 pl-12 pr-5 text-sm text-slate-700 outline-none transition focus:border-pink-200 focus:ring-2 focus:ring-pink-100" />
                            </label>
                            <button id="btnNovaMarca" type="button" class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-pink-500 via-fuchsia-500 to-violet-500 px-6 py-4 text-sm font-semibold text-white shadow-color-pink transition hover:-translate-y-0.5 hover:shadow-lg">nova marca</button>
                        </div>
                    </div>
                    <div id="feedbackMarca" hidden class="mt-3 text-sm text-rose-500"></div>
                </section>

                <section class="rounded-[2.5rem] bg-white p-8 shadow-soft glass-panel">
                    <div class="flex items-center justify-between gap-4 border-b border-slate-200/60 pb-6">
                        <div>
                            <p class="text-sm font-semibold text-slate-500">visão geral</p>
                            <h3 class="mt-2 text-2xl font-bold text-slate-950">lista de marcas</h3>
                        </div>
                        <span class="rounded-full bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-600">sem id à vista</span>
                    </div>

                    <ul id="listaMarcas" class="mt-8 space-y-4">
                        <li class="rounded-[2rem] bg-white p-6 text-slate-500 shadow-sm">carregando marcas...</li>
                    </ul>
                </section>
            </div>
        </main>

        <!-- overlay / slide-over: nova/editar marca -->
        <div id="overlayMarca" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm">
            <div class="w-full max-w-lg transform rounded-[2rem] bg-white p-8 shadow-soft transition-all">
                <form id="formMarca" class="flex flex-col gap-4">
                    <input type="hidden" id="idField" />
                    <div>
                        <label for="nomeField" class="block text-sm font-medium text-slate-700">nome da marca</label>
                        <input id="nomeField" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-3 text-sm" placeholder="ex: honda" required minlength="2" />
                    </div>
                    <div class="flex gap-3">
                        <button type="submit" class="ml-auto rounded-full bg-pink-500 px-5 py-2 text-sm font-semibold text-white">salvar</button>
                        <button type="button" id="btnCancelarMarca" class="rounded-full border px-5 py-2 text-sm">cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="js/controllers/marcaController.js"></script>
</body>
</html>
